# Deploy pipeline. All deploy steps are written but inert until the listed
# secrets are configured — see docs/operations/deployment.md.
name: Main

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key

  # Applies committed migrations to the hosted project. Requires manual
  # approval via the "production" environment plus SUPABASE_ACCESS_TOKEN,
  # SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_REF secrets.
  migrate:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Apply migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  # Deploys are owned by Vercel's git integration, which builds and promotes
  # main on every push on its own — the DEPLOY_HOOK_URL secret is no longer
  # used. This job waits for that git-integration deployment to finish, then
  # smoke tests it.
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Wait for Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TIMEOUT=600
          INTERVAL=20
          ELAPSED=0

          echo "Waiting for Vercel git-integration deployment of ${GITHUB_SHA}..."
          DEPLOYMENT_ID=""
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            DEPLOYMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.[] | select(.creator.login == "vercel[bot]" or .environment == "Production")] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$DEPLOYMENT_ID" ]; then
              break
            fi
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::Timed out after ${TIMEOUT}s waiting for a Vercel deployment record for sha ${GITHUB_SHA}"
            exit 1
          fi
          echo "Found deployment ${DEPLOYMENT_ID}, waiting for it to succeed..."

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses?per_page=1" \
              --jq '.[0].state // empty')
            case "$STATE" in
              success)
                echo "Deployment ${DEPLOYMENT_ID} succeeded."
                exit 0
                ;;
              failure | error)
                echo "::error::Vercel deployment ${DEPLOYMENT_ID} reported state '${STATE}'"
                exit 1
                ;;
            esac
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "::error::Timed out after ${TIMEOUT}s waiting for deployment ${DEPLOYMENT_ID} to reach a terminal state"
          exit 1
      - name: Smoke test
        run: curl -fsS "$SMOKE_URL/api/health"
        env:
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
